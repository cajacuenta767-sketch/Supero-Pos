name: Frontend

on:
  push:
    branches: [main]
  pull_request:

# Una sola ejecución por rama: un push nuevo cancela el anterior.
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verificar frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos
        run: npx tsc --noEmit

      - name: Formato
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Compilar
        run: npm run build

  hygiene:
    name: Higiene del repositorio
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Esto es exactamente lo que se coló al versionar node_modules: un BOM
      # en .gitignore anuló la regla y nadie lo vio hasta el diff del PR.
      - name: Ningún artefacto de dependencias o build versionado
        run: |
          intrusos=$(git ls-files | grep -E '(^|/)(node_modules|dist|dist-demo|dist-electron|build)/' || true)
          if [ -n "$intrusos" ]; then
            echo "::error::Hay archivos versionados que deberían estar ignorados:"
            echo "$intrusos" | head -20
            echo "Total: $(echo "$intrusos" | wc -l)"
            exit 1
          fi
          echo "Sin artefactos versionados."

      - name: Sin BOM ni UTF-16 en los archivos de configuración
        run: |
          fallos=0
          for f in $(git ls-files '*.json' '*.js' '*.cjs' '*.ts' '*.yml' '*.yaml' '.gitignore' '.*rc*'); do
            if [ -f "$f" ] && head -c 3 "$f" | od -An -tx1 | grep -qE 'ef bb bf|ff fe|fe ff'; then
              echo "::error file=$f::Marca de orden de bytes o codificación UTF-16 detectada"
              fallos=1
            fi
          done
          exit $fallos
