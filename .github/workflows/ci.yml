name: CI

on:
  push:
    branches: [main]
  pull_request:

# Una sola ejecución por rama: un push nuevo cancela el anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verificar frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos
        run: npx tsc --noEmit

      - name: Formato
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # La cadena no ejecutaba una sola línea del código: tipos, formato, lint y
      # empaquetado dicen que compila, no que calcula bien.
      - name: Pruebas
        run: npm test

      - name: Compilar
        run: npm run build

      - name: Comprobar que el build no lleva credenciales de demostración
        # Sin VITE_DEMO_MODE, Vite elimina el bloque entero. Si alguna cadena
        # sobrevive, es que el modo demostración se coló en un build real.
        run: |
          if grep -rqE 'SuperoPOS2026|supervisor123|cajero123|almacen123' dist/; then
            echo "::error::El build contiene credenciales de demostración."
            grep -rlE 'SuperoPOS2026|supervisor123|cajero123|almacen123' dist/
            exit 1
          fi
          echo "Build limpio de credenciales."

      - name: Comprobar que el PIN de supervisor no viaja en el build
        # El PIN de demostración vive tras `IS_DEMO_MODE`, que Vite dobla a
        # falso en un build real. Si la variable o su valor por defecto siguen
        # ahí, la autorización volvería a decidirse en el navegador con un
        # secreto que cualquiera lee desde las herramientas del desarrollador.
        run: |
          if grep -rq 'VITE_DEMO_SUPERVISOR_PIN' dist/; then
            echo "::error::El build lleva el PIN de demostración."
            grep -rl 'VITE_DEMO_SUPERVISOR_PIN' dist/
            exit 1
          fi
          if ! grep -rq 'auth/verify-pin' dist/; then
            echo "::error::El build no llama al endpoint de autorización del servidor."
            exit 1
          fi
          echo "La autorización por PIN la decide el servidor."

  backend:
    name: Verificar backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Una base de verdad: las migraciones se daban por buenas sin haberse
    # aplicado nunca, así que un esquema que no arranca se descubría al
    # desplegar y no aquí.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: supero_pos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/supero_pos_ci?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma
        run: npx prisma generate

      - name: Comprobar tipos
        run: npx tsc --noEmit

      # El backend no tenía configuración de ESLint: `npm run lint` fallaba con
      # un error de configuración y nadie lo ejecutaba.
      - name: Lint
        run: npx eslint src --ext .ts --max-warnings 20

      - name: Aplicar migraciones sobre PostgreSQL
        run: npx prisma migrate deploy

      # Que el esquema del código y el de la base coincidan: una migración
      # olvidada rompe el despliegue, no la revisión.
      - name: Comprobar que no falta ninguna migración
        run: |
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code && echo "El esquema de la base coincide con el del código."

      # Sin siembra, una instalación nueva no tiene con qué iniciar sesión.
      - name: Sembrar una instalación nueva
        env:
          SEED_ADMIN_PASSWORD: contrasena-solo-para-la-integracion-continua
          SEED_SUPERVISOR_PIN: '135790'
        run: npm run prisma:seed

      # Idempotente: volver a sembrar no debe duplicar ni pisar nada.
      - name: Sembrar por segunda vez
        env:
          SEED_ADMIN_PASSWORD: contrasena-solo-para-la-integracion-continua
          SEED_SUPERVISOR_PIN: '135790'
        run: npm run prisma:seed

      # Las cuatro suites existían desde el principio y ningún workflow las
      # ejecutaba: una llevaba tiempo rota sin que nadie lo notara.
      - name: Pruebas
        run: npx jest --ci

      - name: Comprobar que no hay secretos por defecto en el código
        run: |
          # Se busca un valor por defecto real —una asignación o un `||`—, no la
          # mención del problema en un comentario, que es documentación útil.
          if grep -rnE "(JWT_SECRET *(\|\||\?\?) *['\"])|secretOrKey *: *['\"]" src/; then
            echo "::error::Hay un secreto JWT por defecto en el código."
            exit 1
          fi
          if grep -rq "headers\['x-user-role'\]" src/; then
            echo "::error::El rol se está leyendo de una cabecera HTTP."
            exit 1
          fi
          echo "Sin secretos por defecto ni autorización por cabecera." 

  hygiene:
    name: Higiene del repositorio
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Esto es exactamente lo que se coló al versionar node_modules: un BOM
      # en .gitignore anuló la regla y nadie lo vio hasta el diff del PR.
      - name: Ningún artefacto de dependencias o build versionado
        run: |
          intrusos=$(git ls-files | grep -E '(^|/)(node_modules|dist|dist-demo|dist-electron|build)/' || true)
          if [ -n "$intrusos" ]; then
            echo "::error::Hay archivos versionados que deberían estar ignorados:"
            echo "$intrusos" | head -20
            echo "Total: $(echo "$intrusos" | wc -l)"
            exit 1
          fi
          echo "Sin artefactos versionados."

      - name: Sin BOM ni UTF-16 en los archivos de configuración
        run: |
          fallos=0
          for f in $(git ls-files '*.json' '*.js' '*.cjs' '*.ts' '*.yml' '*.yaml' '.gitignore' '.*rc*'); do
            if [ -f "$f" ] && head -c 3 "$f" | od -An -tx1 | grep -qE 'ef bb bf|ff fe|fe ff'; then
              echo "::error file=$f::Marca de orden de bytes o codificación UTF-16 detectada"
              fallos=1
            fi
          done
          exit $fallos
